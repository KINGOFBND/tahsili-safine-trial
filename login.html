<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | سفینه</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-content">
      <div class="logo">سفینه</div>
      <nav>
        <a href="index.html">خانه</a>
        <a href="login.html">ورود</a>
      </nav>
    </div>
  </header>

  <section class="login-section">
    <div class="login-box">
      <h1>ورود به سامانه</h1>
      <p class="login-subtitle">لطفاً اطلاعات خود را وارد کنید</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">نام کاربری</label>
          <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" required />
        </div>

        <div class="form-group">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required />
        </div>

        <div class="form-group">
          <label for="role">نقش کاربر</label>
          <select id="role" required>
            <option value="">انتخاب کنید</option>
            <option value="student">دانش‌آموز</option>
            <option value="teacher">همکار آموزشی</option>
            <option value="admin">مدیر</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary full-width">ورود</button>
      </form>

      <p class="login-note">
        برای تست: هر نام کاربری و رمز عبوری وارد کنید و فقط نقش را انتخاب کنید.
      </p>
    </div>
  </section>

  <script src="assets/js/app.js"></script>
</body>
</html>
